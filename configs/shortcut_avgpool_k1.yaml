# ============================================================
# Shortcut experiment: shortcut_type=avgpool, K=1
# Pair: shortcut_avgpool_k1.yaml vs. shortcut_auto_k3.yaml
# Identical recipe; only shortcut_type and skip_kernel_sizes differ.
#   avgpool, K=1 -> AvgPool 2x2 + 1x1 conv shortcut (4,368,690 params)
#   auto,    K=3 -> 3x3 stride-2 conv shortcut      (4,906,290 params)
# See BRANCH_NOTES.md, section 1.
#
# Architecture decisions made by this config (shapes per image):
#   Stem:      conv3x3 3->40, BN, ReLU                          -> 40x32x32
#   Stage 1:   2 blocks, identity shortcuts (shape unchanged)    -> 40x32x32
#   Stage 2:   Block 2.1 shortcut = AvgPool 2x2 -> conv1x1 40->80   -> 80x16x16
#              Block 2.2 identity
#   Stage 3:   Block 3.1 shortcut = AvgPool 2x2 -> conv1x1 80->160  -> 160x8x8
#              Block 3.2 identity
#   Stage 4:   Block 4.1 shortcut = AvgPool 2x2 -> conv1x1 160->320 -> 320x4x4
#              Block 4.2 identity
#   Head:      global avg pool 4x4 -> FC 320->10
#
#   Why AvgPool here: shortcut_type=avgpool replaces every downsampling
#   shortcut (stride 2) with AvgPool + 1x1 conv, as in ResNet-D
#   (He et al., 2019). A plain 1x1 stride-2 conv would see only 1/4 of the
#   pixels; the 2x2 average lets every pixel contribute. 0 extra params.
# ============================================================

experiment_name: "shortcut_avgpool_k1"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 2
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: false

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [2, 2, 2, 2]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10

training:
  epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/shortcut_avgpool_k1"
  filename: "best.pth"
