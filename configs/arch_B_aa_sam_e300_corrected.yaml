# ============================================================
# Optimizer experiment: SAM (sharpness-aware minimization), 300 epochs
# Clean rerun of arch_B_aa_sam_e300 (that run crashed after epoch 283 with best val 97.46%,
# and an accidental double launch corrupted its HPC checkpoint folder). Identical recipe.
# Compare with arch_B_autoaug_e300 (SGD, 97.06% val, 88.20% Kaggle w/ TTA) and arch_B_aa_adamw_e300.
#
# SAM (Foret et al., 2021) wraps our SGD recipe unchanged (lr 0.1, momentum 0.9, wd 5e-4,
# cosine): each step first moves the weights by rho along the normalized gradient, takes the
# gradient there, moves back, and steps with that gradient. This favors flat minima.
# rho = 0.05 is the paper's CIFAR default (not tuned here). ~2x compute per step.
# amp: true (bf16) to offset the extra compute; the SGD baseline was fp32.
# Architecture: B [3,7,6,1], C=[40,80,160,320], 4,976,530 params. See BRANCH_NOTES.md, section 10.
# ============================================================

experiment_name: "arch_B_aa_sam_e300_corrected"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 4                      # AutoAugment runs on CPU; 2 workers may starve the GPU
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: true                 # New vs. arch_B_shift_deepen

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [3, 7, 6, 1]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10

training:
  epochs: 300
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  optimizer: sam                      # SGD + sharpness-aware steps (default: sgd)
  sam_rho: 0.05
  amp: true                           # bf16 mixed precision (~2x faster)
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/arch_B_aa_sam_e300_corrected"
  filename: "best.pth"
