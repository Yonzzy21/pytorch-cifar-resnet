# ============================================================
# Architecture experiment: arch_A_shift_widen
# Compare: arch_A_shift_widen vs. arch_B_shift_deepen (both ~5.0M params),
#          baseline = shortcut_avgpool_k1 (same recipe).
# Only blocks_per_layer / channels differ from the baseline.
# See BRANCH_NOTES.md, section 2.
#
# Architecture decisions made by this config (4,996,266 params, 22 convs in blocks):
#   Stem:     conv3x3 3->48, BN, ReLU -> 48x32x32
#   Stage 1:  2 blocks, C=48, identity shortcuts
#             -> 48x32x32, 83,328 params
#   Stage 2:  4 blocks, C=96, block 2.1 shortcut = AvgPool 2x2 -> conv1x1 48->96
#             -> 96x16x16, 628,416 params
#   Stage 3:  4 blocks, C=184, block 3.1 shortcut = AvgPool 2x2 -> conv1x1 96->184
#             -> 184x8x8, 2,312,880 params
#   Stage 4:  1 block, C=376, block 4.1 shortcut = AvgPool 2x2 -> conv1x1 184->376
#             -> 376x4x4, 1,966,480 params
#   Head:     global avg pool 4x4 -> FC 376->10
#
#   Why: Shift + widen: move capacity out of stage 4 (one 4x4 block costs ~1.84M
#        params at C=320) into stages 2-3, then spend the leftover budget on wider
#        channels. Widths chosen to use ~99.9% of the 5M budget (all multiples of 8).
#   Baseline for reference: [2,2,2,2], C=[40,80,160,320], 4,368,690 params, 16 convs.
# ============================================================

experiment_name: "arch_A_shift_widen"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 2
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: false

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [2, 4, 4, 1]
  channels: [48, 96, 184, 376]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10

training:
  epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/arch_A_shift_widen"
  filename: "best.pth"
