# ============================================================
# Architecture experiment: arch_J_3332 (Jonathan's layout)
# Compare: arch_B_shift_deepen vs. arch_J_3332 (both ~4.98M params),
#          same recipe as section 2 (batch 128, lr 0.1, 100 epochs, no early stopping).
# Only blocks_per_layer differs from arch_B_shift_deepen.
# Jonathan's original runs of this layout used lr 0.01, batch 64, 80 epochs,
# early stopping and AutoAugment, so they are not comparable to B.
# See BRANCH_NOTES.md, section 4.
#
# Architecture decisions made by this config (4,974,610 params, 22 convs in blocks):
#   Stem:     conv3x3 3->40, BN, ReLU -> 40x32x32
#   Stage 1:  3 blocks, C=40, identity shortcuts
#             -> 40x32x32, 86,880 params
#   Stage 2:  3 blocks, C=80, block 2.1 shortcut = AvgPool 2x2 -> conv1x1 40->80
#             -> 80x16x16, 321,120 params
#   Stage 3:  3 blocks, C=160, block 3.1 shortcut = AvgPool 2x2 -> conv1x1 80->160
#             -> 160x8x8, 1,282,240 params
#   Stage 4:  2 blocks, C=320, block 4.1 shortcut = AvgPool 2x2 -> conv1x1 160->320
#             -> 320x4x4, 3,280,000 params
#   Head:     global avg pool 4x4 -> FC 320->10
#
#   Why: Balanced layout that keeps 2 blocks in stage 4 (66% of params on the
#        4x4 map). B is the opposite bet: 1 stage-4 block, extra depth in
#        stages 2-3 (34 convs). Same widths and ~same budget, so this tests
#        where the capacity should go.
# ============================================================

experiment_name: "arch_J_3332"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 2
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: false

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [3, 3, 3, 2]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10

training:
  epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/arch_J_3332"
  filename: "best.pth"
