# ============================================================
# Rotation auxiliary task, TrivialAugment, 300 epochs, 45k split
#
# Recipe: arch_B_autoaug_e300 (SGD, 97.06% val, 88.2% Kaggle w/ TTA) + a self-supervised task:
#   each batch also gets a randomly rotated copy (0/90/180/270 deg) and a 4-way head
#   (1,284 params, counted in the budget) predicts the rotation.
#   loss = CE(class) + 0.5 * CE(rotation)   (0.5 as in Hendrycks et al., 2019; not tuned here)
# Why: that paper found the rotation task improves robustness to distribution shift while
#   clean accuracy barely changes, which is our situation (val saturated, Kaggle test shifted).
#   A public repo of a similar NYU challenge reports 0.909 Kaggle with rotation + TrivialAugment.
# Training images only (the test images are never used). amp: true (bf16) for speed.
# Pair: arch_B_rot_aa_e300 (same, AutoAugment).
# ============================================================

experiment_name: "arch_B_rot_ta_e300"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 4                      # AutoAugment runs on CPU; 2 workers may starve the GPU
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: false
    trivialaugment: true              # Instead of AutoAugment

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [3, 7, 6, 1]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10
  rotation_head: true                 # 4-way rotation head (training only)

training:
  epochs: 300
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  amp: true                           # bf16 mixed precision (~2x faster)
  rotation_weight: 0.5                # Weight of the rotation loss (0 = off)
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/arch_B_rot_ta_e300"
  filename: "best.pth"
