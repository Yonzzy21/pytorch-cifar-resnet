# ============================================================
# Optimizer experiment: AdamW, 300 epochs
# Compare with arch_B_autoaug_e300 (SGD, 97.06% val) and arch_B_aa_sam_e300.
#
# AdamW (Loshchilov & Hutter, 2019): Adam with decoupled weight decay. It needs its own
# hyperparameters; SGD's lr 0.1 / wd 5e-4 do not transfer. lr 1e-3 and weight_decay 0.05 are
# common defaults for AdamW on CIFAR ResNets, used here without tuning (single run), so a
# loss vs. SGD may partly reflect untuned settings. Same cosine schedule, no warmup.
# amp: true (bf16), same as the SAM run. momentum is ignored by AdamW.
# Architecture: B [3,7,6,1], C=[40,80,160,320], 4,976,530 params. See BRANCH_NOTES.md, section 10.
# ============================================================

experiment_name: "arch_B_aa_adamw_e300"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 4                      # AutoAugment runs on CPU; 2 workers may starve the GPU
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: true                 # New vs. arch_B_shift_deepen

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [3, 7, 6, 1]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10

training:
  epochs: 300
  optimizer: adamw                    # default: sgd
  lr: 0.001                           # AdamW default range (SGD uses 0.1)
  momentum: 0.9
  weight_decay: 0.05                  # decoupled; AdamW scale (SGD uses 5e-4)
  amp: true                           # bf16 mixed precision
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/arch_B_aa_adamw_e300"
  filename: "best.pth"
