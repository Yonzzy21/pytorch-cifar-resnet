# ============================================================
# Shortcut experiment: shortcut_type=auto, K=3
# Pair: shortcut_avgpool_k1.yaml vs. shortcut_auto_k3.yaml
# Identical recipe; only shortcut_type and skip_kernel_sizes differ.
#   avgpool, K=1 -> AvgPool 2x2 + 1x1 conv shortcut (4,368,690 params)
#   auto,    K=3 -> 3x3 stride-2 conv shortcut      (4,906,290 params)
# See BRANCH_NOTES.md, section 1.
#
# Architecture decisions made by this config (shapes per image):
#   Stem:      conv3x3 3->40, BN, ReLU                          -> 40x32x32
#   Stage 1:   2 blocks, identity shortcuts (shape unchanged)    -> 40x32x32
#   Stage 2:   Block 2.1 shortcut = conv3x3 stride 2, 40->80     -> 80x16x16
#              Block 2.2 identity
#   Stage 3:   Block 3.1 shortcut = conv3x3 stride 2, 80->160    -> 160x8x8
#              Block 3.2 identity
#   Stage 4:   Block 4.1 shortcut = conv3x3 stride 2, 160->320   -> 320x4x4
#              Block 4.2 identity
#   Head:      global avg pool 4x4 -> FC 320->10
#
#   Why conv3x3 here: shortcut_type=auto uses AvgPool + 1x1 only where a
#   K x K stride-s conv would skip pixels (K < s). Here K=3 >= stride 2,
#   so the overlapping 3x3 windows already see every pixel and auto keeps
#   the conv shortcut. Same model as shortcut_type=conv with K=3
#   (Jonathan's resnet18_k3_skip architecture). Costs +537,600 params
#   vs. the AvgPool + 1x1 version.
# ============================================================

experiment_name: "shortcut_auto_k3"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 2
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: false

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [2, 2, 2, 2]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [3, 3, 3, 3]
  shortcut_type: "auto"
  pool_size: 4
  num_classes: 10

training:
  epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/shortcut_auto_k3"
  filename: "best.pth"
