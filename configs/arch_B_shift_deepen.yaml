# ============================================================
# Architecture experiment: arch_B_shift_deepen
# Compare: arch_A_shift_widen vs. arch_B_shift_deepen (both ~5.0M params),
#          baseline = shortcut_avgpool_k1 (same recipe).
# Only blocks_per_layer / channels differ from the baseline.
# See BRANCH_NOTES.md, section 2.
#
# Architecture decisions made by this config (4,976,530 params, 34 convs in blocks):
#   Stem:     conv3x3 3->40, BN, ReLU -> 40x32x32
#   Stage 1:  3 blocks, C=40, identity shortcuts
#             -> 40x32x32, 86,880 params
#   Stage 2:  7 blocks, C=80, block 2.1 shortcut = AvgPool 2x2 -> conv1x1 40->80
#             -> 80x16x16, 783,200 params
#   Stage 3:  6 blocks, C=160, block 3.1 shortcut = AvgPool 2x2 -> conv1x1 80->160
#             -> 160x8x8, 2,666,560 params
#   Stage 4:  1 block, C=320, block 4.1 shortcut = AvgPool 2x2 -> conv1x1 160->320
#             -> 320x4x4, 1,435,520 params
#   Head:     global avg pool 4x4 -> FC 320->10
#
#   Why: Shift + deepen: same widths as baseline, move capacity out of stage 4
#        (one 4x4 block costs ~1.84M params) into extra blocks in stages 1-3
#        (~29k / ~116k / ~461k params each). Uses ~99.5% of the 5M budget.
#   Baseline for reference: [2,2,2,2], C=[40,80,160,320], 4,368,690 params, 16 convs.
# ============================================================

experiment_name: "arch_B_shift_deepen"
seed: 42
max_params: 5000000

wandb:
  enabled: true
  project: "cifar10-resnet-challenge"
  entity: "the_distillers"

data:
  data_dir: "../data"
  train_batch_size: 128
  test_batch_size: 100
  num_workers: 2
  val_ratio: 0.10                     # 45k train, 5k val
  augmentation:
    random_crop: true
    horizontal_flip: true
    cutout: true
    cutout_prob: 0.5
    color_jitter: false
    autoaugment: false

model:
  name: "CustomResNet"
  num_layers: 4
  blocks_per_layer: [3, 7, 6, 1]
  channels: [40, 80, 160, 320]
  conv_kernel_sizes: [3, 3, 3, 3]
  skip_kernel_sizes: [1, 1, 1, 1]
  shortcut_type: "avgpool"
  pool_size: 4
  num_classes: 10

training:
  epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  early_stopping_patience: null       # Disabled: let the cosine schedule run to the end

checkpoint:
  dir: "./checkpoints/arch_B_shift_deepen"
  filename: "best.pth"
